name: Tests

'on': [push, pull_request]

permissions:
  contents: read

jobs:
  sqlite:
    name: SQLite · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q *.py tests

  postgres:
    name: PostgreSQL 17 · Python 3.12
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: adaptlearn_ci
          POSTGRES_PASSWORD: ephemeral_ci_database
          POSTGRES_DB: adaptlearn_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U adaptlearn_ci -d adaptlearn_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-deploy.txt
      - run: python -m pip install -r requirements-deploy.txt
      - run: python -m unittest discover -s tests -p 'test_postgres.py' -v
        env:
          TEST_DATABASE_URL: postgresql://adaptlearn_ci:ephemeral_ci_database@127.0.0.1:${{ job.services.postgres.ports[5432] }}/adaptlearn_ci

  compose:
    name: Démarrage de la pile Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Préparer les secrets éphémères
        run: |
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          from secrets import token_hex

          variables = ('SECRET_KEY', 'AI_SERVICE_TOKEN', 'POSTGRES_PASSWORD')
          Path('.env').write_text(''.join(f'{key}={token_hex(32)}\n' for key in variables))
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail --silent --show-error http://127.0.0.1:5050/health
      - name: Vérifier la génération sur le réseau privé
        run: |
          docker compose exec -T web python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          payload = {
              'kind': 'summary',
              'query': 'variables Python',
              'sources': [{
                  'document_id': 'verification-ci', 'title': 'Variables',
                  'text': 'Une variable Python associe un nom à une valeur.',
                  'chunk_index': 0, 'score': 1.0,
              }],
          }
          request = Request(
              f"{os.environ['AI_SERVICE_URL']}/generate",
              data=json.dumps(payload).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['AI_SERVICE_TOKEN']}",
                  'Content-Type': 'application/json',
              },
          )
          with urlopen(request, timeout=5) as response:
              result = json.load(response)
          assert result['mode'] == 'local' and result['kind'] == 'summary'
          PY
      - if: failure()
        run: docker compose ps --all
      - if: always()
        run: docker compose down --volumes
