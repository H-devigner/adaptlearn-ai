# Fournisseur factice réservé à la CI : ne pas utiliser pour une démonstration du RAG.
services:
  ai:
    environment:
      AI_MODE: llm
      LLM_BASE_URL: http://fake-llm:8050/v1
      LLM_API_KEY: test-only
      LLM_MODEL: fake-ci
    depends_on:
      fake-llm:
        condition: service_started
  fake-llm:
    image: python:3.12-slim
    command: ['python', '/tests/fake_llm.py']
    volumes:
      - ./tests/support/fake_llm.py:/tests/fake_llm.py:ro
    networks:
      - app
